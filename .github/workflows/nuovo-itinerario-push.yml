name: Fuori Mappa - notifica nuovi itinerari

on:
  push:
    paths:
      - itinerari.html
  workflow_dispatch:
    inputs:
      percorso:
        description: 'Pagina itinerario gia pubblicata per la prova sul tuo iPhone (es. thailandia.html)'
        required: true
        default: 'thailandia.html'
        type: string

permissions:
  contents: read

concurrency:
  group: fuorimappa-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notifica:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Recupera file e storia del catalogo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Controlla nuovi itinerari e invia su OneSignal
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          FM_PUSH_MODE: ${{ vars.FM_PUSH_MODE }}
          FM_TEST_SUBSCRIPTION_ID: ${{ vars.FM_TEST_SUBSCRIPTION_ID }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_BEFORE_SHA: ${{ github.event.before }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
          FM_MANUAL_PATH: ${{ inputs.percorso }}
        run: python3 scripts/fm_notify_itinerary.py
