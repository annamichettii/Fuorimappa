<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reimposta la password | Fuori Mappa</title><meta name="robots" content="noindex"><style>*{box-sizing:border-box}body{margin:0;background:#f5eadb;color:#30281f;font:16px/1.6 Arial,sans-serif;padding:6vh 16px}.paper{max-width:500px;margin:auto;padding:32px;background:#fffaf1;border:1px solid #d6c5ab;box-shadow:7px 9px 0 #30281f10;border-radius:14px}h1{font:normal 40px Georgia,serif;margin:14px 0}label{display:grid;gap:8px;font-size:14px;font-weight:700}input{font:inherit;padding:14px;border-radius:8px;border:1px solid #bda78c;width:100%}button{margin-top:18px;background:#30281f;color:white;border:0;border-radius:8px;padding:13px 19px;font:700 15px Arial,sans-serif;width:100%}a{color:#5d412d}p{font-size:14px}</style></head><body><main class="paper"><span>✦ FUORI MAPPA</span><h1>Nuova password</h1><p>Questa pagina serve soltanto a reimpostare la password dopo aver aperto il link ricevuto per email. Quando hai finito, riapri Fuori Mappa dall'icona sul telefono.</p><form id="reset" hidden><label>Nuova password (almeno 10 caratteri)<input type="password" autocomplete="new-password" minlength="10" required></label><button type="submit">Salva la nuova password</button></form><p id="msg" role="status" aria-live="polite">Verifica del link in corso…</p><a href="index.html">Torna a Fuori Mappa</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(async()=>{const msg=document.getElementById('msg'),form=document.getElementById('reset');if(!window.supabase){msg.textContent='Impossibile caricare la connessione sicura.';return;}const c=window.supabase.createClient('https://otyhjkwysfssmipfhwzn.supabase.co','sb_publishable_B3aPB9yJb-IarCfzD6ZZkw_E8yAVwlO',{auth:{detectSessionInUrl:true,flowType:'implicit'}});const {data,error}=await c.auth.getSession();if(error||!data?.session){msg.textContent='Link scaduto o non valido. Torna nell’app e richiedi un nuovo link.';return;}msg.textContent='Scegli una password nuova.';form.hidden=false;form.addEventListener('submit',async e=>{e.preventDefault();const p=form.querySelector('input').value;if(p.length<10)return;msg.textContent='Salvataggio in corso…';const {error}=await c.auth.updateUser({password:p});if(error){msg.textContent=error.message;return;}msg.textContent='Password cambiata! Torna nell’app e accedi.';form.hidden=true;await c.auth.signOut();});})();
</script></body></html>
